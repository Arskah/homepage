# Revalidate everything by default: without Cache-Control browsers guess a
# freshness lifetime from Last-Modified and keep serving stale pages after a
# release. ETag keeps the revalidation a cheap 304.
Header set Cache-Control "no-cache"

# Build assets carry a content hash in their name, so they never change.
# stylex.css is the exception: unplugin-stylex emits it under a fixed name.
<LocationMatch "^/_astro/(?!stylex\.css$)">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
