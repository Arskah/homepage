# TLS ends at the proxy in front, so httpd sees plain http and uses that scheme
# in the redirect mod_dir sends for a directory URL without its trailing slash.
# Send that redirect from here instead, with the scheme of the visitor's
# request. Without the proxy header mod_dir still handles it.
LoadModule rewrite_module modules/mod_rewrite.so

RewriteEngine On
RewriteCond %{HTTP:X-Forwarded-Proto} =https
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
RewriteRule ^(.*[^/])$ https://%{HTTP_HOST}$1/ [L,R=301]
