name: Lint

on:
  workflow_call:

jobs:
  lint:
    name: Run linter
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Run Prettier
        run: |
          pnpm exec prettier --check .

      - name: Run Linter
        run: |
          pnpm lint

      # Pinned: without a version, npm on a newer Node than Renovate's `engines` allows picks the last
      # Renovate without an upper bound, which is too old to know the current config options.
      - name: Validate Renovate config
        run: npx --yes --package renovate@44.192.2 -- renovate-config-validator renovate.json
