allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Renovate security update: astro@6.1.6 || 6.1.10 || 6.4.6 || 7.1.0 || 7.4.7
  - astro@6.1.6 || 6.1.10 || 6.4.6 || 7.1.0 || 7.4.7
  - yaml@2.8.3
  - devalue@5.8.1
overrides:
  # rolldown's wasm binding accepts the 2.0 betas, and pnpm then hands the beta
  # runtime to packages whose @emnapi/core is 1.x: @astrojs/check fails to load
  # and astro check reports it as not installed. All of them accept ^1.7.1.
  "@emnapi/core": 1.11.3
  "@emnapi/runtime": 1.11.3
